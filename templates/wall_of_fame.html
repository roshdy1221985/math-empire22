<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🏅 جدار الفخر - إمبراطورية الرياضيات</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #0a0f23 0%, #1a1f3a 50%, #0a0f23 100%);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
}

/* 🌌 خلفية متحركة */
body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: 
        radial-gradient(circle at 15% 30%, rgba(212,175,55,0.10) 0%, transparent 50%),
        radial-gradient(circle at 85% 70%, rgba(168,85,247,0.08) 0%, transparent 50%);
    animation: bgGlow 14s ease-in-out infinite;
}
@keyframes bgGlow { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

/* ⭐ نجوم متحركة */
body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(255,215,0,0.3) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: starsFloat 30s linear infinite;
    opacity: 0.4;
}
@keyframes starsFloat { 0% { background-position: 0 0; } 100% { background-position: 0 60px; } }

.container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

/* 👑 الرأس */
.header { text-align: center; padding: 40px 20px 30px; }
.header .crown {
    font-size: 4.5rem;
    display: inline-block;
    animation: crownBounce 2.5s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(212,175,55,0.6), 0 0 60px rgba(212,175,55,0.3);
}
@keyframes crownBounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
}
.header h1 {
    font-family: 'Amiri', serif;
    font-size: 2.5rem;
    background: linear-gradient(135deg, #b38728, #d4af37, #fcf6ba, #d4af37, #b38728);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
    margin: 12px 0;
    font-weight: 900;
}
@keyframes shine { to { background-position: 200% center; } }
.header p { color: rgba(255,255,255,0.7); font-size: 1.05rem; }

/* 📊 بطاقات الإحصاءات */
.stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin: 24px auto 30px;
    max-width: 700px;
}
.stat-card {
    background: linear-gradient(135deg, rgba(212,175,55,0.10), rgba(212,175,55,0.02));
    backdrop-filter: blur(16px);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}
.stat-card .icon { font-size: 1.8rem; margin-bottom: 4px; }
.stat-card .num {
    font-family: 'Amiri', serif;
    font-size: 2rem;
    color: #d4af37;
    font-weight: 900;
    text-shadow: 0 0 16px rgba(212,175,55,0.4);
}
.stat-card .label { color: rgba(255,255,255,0.65); font-size: 0.85rem; }

/* 🎴 بطاقات الشهادات */
.certs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
    margin-top: 20px;
}
.cert-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 18px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
    cursor: pointer;
}
.cert-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--cert-color, #d4af37), transparent);
    opacity: 0;
    transition: opacity 0.3s;
}
.cert-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 32px rgba(212,175,55,0.2);
    border-color: rgba(212,175,55,0.5);
}
.cert-card:hover::before { opacity: 1; }

.cert-icon {
    font-size: 3rem;
    text-align: center;
    margin-bottom: 10px;
    animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.cert-title {
    text-align: center;
    font-family: 'Amiri', serif;
    font-size: 1.15rem;
    color: var(--cert-color, #d4af37);
    font-weight: bold;
    margin-bottom: 10px;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cert-info {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 10px;
    margin-top: 10px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
}
.cert-info .row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.cert-info .student { color: #fcf6ba; font-weight: bold; }

.cert-date {
    background: rgba(0,0,0,0.3);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.5);
    text-align: center;
    margin-top: 8px;
}

/* 🌟 شارة "جديد" */
.new-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: white;
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: bold;
    animation: pulse 2s infinite;
    box-shadow: 0 4px 12px rgba(46,204,113,0.4);
}
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

.loading {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255,255,255,0.6);
}
.loading::before {
    content: '';
    display: inline-block;
    width: 40px; height: 40px;
    border: 4px solid rgba(212,175,55,0.2);
    border-top-color: #d4af37;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
    text-align: center;
    padding: 80px 20px;
    color: rgba(255,255,255,0.5);
}
.empty .icon { font-size: 4rem; margin-bottom: 14px; }

.footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    color: rgba(255,255,255,0.5);
    font-size: 0.85rem;
}
.footer a { color: #d4af37; text-decoration: none; }

@media (max-width: 600px) {
    .header h1 { font-size: 1.8rem; }
    .header .crown { font-size: 3.5rem; }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="crown">👑</div>
        <h1>🏅 جدار الفخر الإمبراطوري</h1>
        <p>تكريم لأبطال إمبراطورية الرياضيات</p>
    </div>
    
    <div class="stats-bar" id="stats-bar" style="display:none;">
        <div class="stat-card">
            <div class="icon">🏆</div>
            <div class="num" id="stat-total">0</div>
            <div class="label">شهادة مُمنوحة</div>
        </div>
        <div class="stat-card">
            <div class="icon">🎓</div>
            <div class="num" id="stat-students">0</div>
            <div class="label">طالب مُكرّم</div>
        </div>
        <div class="stat-card">
            <div class="icon">👨‍🏫</div>
            <div class="num" id="stat-supervisors">0</div>
            <div class="label">مشرف يُكرّم</div>
        </div>
    </div>
    
    <div id="certs-container">
        <div class="loading">جاري تحميل جدار الفخر...</div>
    </div>
    
    <div class="footer">
        <p>👑 إمبراطورية الرياضيات © 2026</p>
        <p style="margin-top: 6px; font-size: 0.78rem;">
            🔒 الأسماء معروضة بشكل جزئي لحماية خصوصية الطلاب
        </p>
    </div>
</div>

<script>
async function loadWallOfFame() {
    try {
        const res = await fetch('/api/public/wall-of-fame?limit=30');
        const data = await res.json();
        renderCerts(data.certificates || []);
    } catch(e) {
        document.getElementById('certs-container').innerHTML = 
            '<div class="empty"><div class="icon">⚠️</div><p>حدث خطأ في التحميل</p></div>';
    }
}

function renderCerts(certs) {
    const cont = document.getElementById('certs-container');
    
    if (!certs.length) {
        cont.innerHTML = '<div class="empty"><div class="icon">🏆</div><h3 style="color:#d4af37;margin-bottom:8px;">لا توجد شهادات بعد</h3><p>كن أول من يحصل على شهادة تقدير!</p></div>';
        return;
    }
    
    // إحصاءات
    document.getElementById('stat-total').textContent = certs.length;
    document.getElementById('stat-students').textContent = new Set(certs.map(c => c.student_name)).size;
    document.getElementById('stat-supervisors').textContent = new Set(certs.map(c => c.supervisor_name)).size;
    document.getElementById('stats-bar').style.display = 'grid';
    
    const now = Date.now();
    const dayMs = 24 * 60 * 60 * 1000;
    
    cont.innerHTML = '<div class="certs-grid">' + certs.map(function(c) {
        const date = c.issued_at ? new Date(c.issued_at) : null;
        const dateStr = date ? date.toLocaleDateString('ar', {year:'numeric',month:'long',day:'numeric'}) : '—';
        const isNew = date && (now - date.getTime()) < (3 * dayMs);
        
        const color = c.template_color || '#d4af37';
        const icon = c.template_icon || '🏆';
        
        return '<div class="cert-card" style="--cert-color:'+color+';" data-qr="'+escAttr(c.qr_code)+'" onclick="openCert(this.dataset.qr)">' +
            (isNew ? '<div class="new-badge">جديد ✨</div>' : '') +
            '<div class="cert-icon">'+icon+'</div>' +
            '<div class="cert-title">'+escHtml(c.title)+'</div>' +
            '<div class="cert-info">' +
                '<div class="row"><span>🎓</span><span class="student">'+escHtml(c.student_name_display || c.student_name)+'</span></div>' +
                '<div class="row"><span>👨‍🏫</span><span>'+escHtml(c.supervisor_name)+'</span></div>' +
            '</div>' +
            '<div class="cert-date">📅 '+dateStr+'</div>' +
        '</div>';
    }).join('') + '</div>';
}

function openCert(qrCode) {
    window.open('/verify-certificate/' + encodeURIComponent(qrCode), '_blank');
}

function escHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});
}

function escAttr(s) {
    return String(s || '').replace(/'/g, '%27').replace(/"/g, '%22');
}

loadWallOfFame();
// تحديث كل دقيقتين
setInterval(loadWallOfFame, 120000);
</script>

</body>
</html>
