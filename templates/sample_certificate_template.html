<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شهادة تقدير</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
@page { size: A4 landscape; margin: 0; }
body { font-family: "Cairo", sans-serif; margin: 0; }
.cert {
    width: 297mm; height: 210mm;
    background: linear-gradient(135deg, #fefae0 0%, #fff3c4 100%);
    padding: 50px;
    border: 12px double #d4af37;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
.icon { font-size: 80px; margin-bottom: 20px; }
.title { font-family: "Amiri", serif; font-size: 56px; color: #8b6914; font-weight: bold; }
.text { font-size: 22px; margin: 12px 0; color: #555; }
.name { font-family: "Amiri", serif; font-size: 60px; color: #5d4e1f; font-weight: bold; padding: 10px 40px; border-bottom: 3px solid #d4af37; margin: 20px 0; }
.achievement { font-size: 24px; color: #b8860b; font-weight: bold; padding: 10px 24px; background: rgba(255,255,255,0.5); border-radius: 8px; margin: 14px 0; }
.footer { display: flex; justify-content: space-around; width: 100%; margin-top: 40px; }
.sign { text-align: center; min-width: 200px; border-top: 2px solid #d4af37; padding-top: 6px; margin-top: 50px; }
</style>
</head>
<body>
<div class="cert">
    <div class="icon">👑</div>
    <div class="title">شهادة تقدير</div>
    <div class="text" style="margin-top:24px;">تُمنح إلى الطالب/ة المتميّز/ة</div>
    <div class="name"></div>
    <div class="text">في </div>
    <div class="text">تقديراً لـ</div>
    <div class="achievement"></div>
    <div class="footer">
        <div><div class="sign"></div></div>
        <div><div class="sign">📅 </div></div>
        <div><div class="sign"></div></div>
    </div>
</div>
</body>
</html>
